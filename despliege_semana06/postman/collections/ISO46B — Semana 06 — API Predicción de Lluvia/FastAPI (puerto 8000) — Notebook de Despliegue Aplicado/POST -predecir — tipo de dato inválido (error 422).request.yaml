$kind: http-request
name: POST /predecir — tipo de dato inválido (error 422)
description: "Caso de error adicional que Flask NO detecta automáticamente: un valor de tipo incorrecto. pydantic lo rechaza antes de que el código del endpoint se ejecute. Respuesta esperada: 422."
url: http://{{host}}:{{puerto_fastapi}}/predecir
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "temp_max": "no-es-un-numero",
      "temp_min": 4.2,
      "viento_max": 12.0
    }
order: 3000
