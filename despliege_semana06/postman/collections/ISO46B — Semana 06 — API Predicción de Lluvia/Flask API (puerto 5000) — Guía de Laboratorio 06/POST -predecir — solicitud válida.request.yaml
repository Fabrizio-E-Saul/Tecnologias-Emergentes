$kind: http-request
name: POST /predecir — solicitud válida
description: 'Caso exitoso: las 3 características requeridas están presentes. Respuesta esperada: 200 OK con {"prediccion": ..., "probabilidad": ...}.'
url: http://{{host}}:{{puerto_flask}}/predecir
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "temp_max": 18.5,
      "temp_min": 4.2,
      "viento_max": 12.0
    }
order: 1000
